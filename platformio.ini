[platformio]
default_envs = rt_spark_f407

[env:rt_spark_f407]
platform = ststm32
framework = stm32cube
board = rt_spark_f407
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = pre:fpu_flags.py
build_flags =
  -I include
  -I lib/FreeRTOS/include
  -I lib/FreeRTOS/portable/GCC/ARM_CM4F
  -D USE_HAL_DRIVER
  -D STM32F407xx
  -D HSE_VALUE=8000000U
build_unflags = -mfloat-abi=soft
build_src_filter = +<*>
lib_extra_dirs = lib
lib_ldf_mode = chain+
; The project board manifest is custom to reserve an explicit place for verified
; RT-Spark memory and ST-LINK parameters. Verify those against the board docs.
