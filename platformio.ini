[platformio]
default_envs = rt_spark_f407

[env:rt_spark_f407]
platform = ststm32
framework = stm32cube
board = rt_spark_f407
upload_protocol = stlink
debug_tool = stlink
build_flags =
  -I include
  -I config
  -I lib/FreeRTOS/include
  -I lib/FreeRTOS/portable/GCC/ARM_CM4F
  -D USE_HAL_DRIVER
  -D STM32F407xx
  -D HSE_VALUE=8000000U
  -D configUSE_PREEMPTION=1
  -D configUSE_IDLE_HOOK=0
  -D configUSE_TICK_HOOK=0
  -D configUSE_TIMERS=1
  -D configSUPPORT_STATIC_ALLOCATION=1
  -D configSUPPORT_DYNAMIC_ALLOCATION=1
  -D configCHECK_FOR_STACK_OVERFLOW=2
  -D configUSE_MALLOC_FAILED_HOOK=1
  -D configUSE_TRACE_FACILITY=1
  -D configUSE_STATS_FORMATTING_FUNCTIONS=1
  -D configGENERATE_RUN_TIME_STATS=0
  -D configTICK_RATE_HZ=1000
  -D configMAX_PRIORITIES=5
  -D configMINIMAL_STACK_SIZE=128
  -D configTOTAL_HEAP_SIZE=24576
  -D configLIBRARY_LOWEST_INTERRUPT_PRIORITY=15
  -D configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY=5
  -D configKERNEL_INTERRUPT_PRIORITY=255
  -D configMAX_SYSCALL_INTERRUPT_PRIORITY=80
  -D configPRIO_BITS=4
  -D configUSE_PORT_OPTIMISED_TASK_SELECTION=1
  -D configUSE_16_BIT_TICKS=0
  -D configUSE_MUTEXES=1
  -D configUSE_COUNTING_SEMAPHORES=1
  -D configQUEUE_REGISTRY_SIZE=8
  -D configUSE_TIME_SLICING=1
  -D configUSE_NEWLIB_REENTRANT=0
  -D configASSERT_DEFINED=1
build_src_filter = +<*>
lib_extra_dirs = lib
lib_ldf_mode = chain+
; The project board manifest is custom to reserve an explicit place for verified
; RT-Spark memory and ST-LINK parameters. Verify those against the board docs.
